name: research-free
# Coimbatore 360: collects Coimbatore-district news only.
# owner 31 Oct: 10 ROUNDS a day at IST 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 (GitHub often starts it a little late).
# Each round collects today's WHOLE-district news, compares it with today's earlier collected news that was not posted yet, writes the
# TOP 3 by expected views (+ every power cut) and starts posting at once. A new day starts fresh. Runs ONLY while research_free/ENABLED exists.
on:
  schedule:
    - cron: "30 22,0,2,4,6,8,10,12,14,16 * * *"    # UTC = IST 04:00 ... 22:00 every 2 hours (owner 31 Oct)
  workflow_dispatch:
    inputs:
      dry:
        description: "dry run (do not write to Sheet / send email)"
        default: "false"
      manual_url:
        description: "optional: one article link to write and post now (today's news only)"
        default: ""
permissions:
  contents: write
  actions: write      # starts the posting job as soon as a story is saved
concurrency: research-free-collect      # owner 29 Oct: own queue - a story-writer run can no longer replace (cancel) a waiting collection
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait while the story writer is running (they must not save the queue at the same time)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/write_stories.yml/runs?status=in_progress" -q '.total_count' 2>/dev/null || echo 0)
            [ "${n:-0}" = "0" ] && break
            echo "story writer is running - waiting ($i/30)"; sleep 30
          done
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check switch
        id: sw
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f research_free/ENABLED ]; then echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.sw.outputs.go == 'yes'
        with: {python-version: "3.11"}
      - run: pip install requests googlenewsdecoder==0.2.2 pillow
        if: steps.sw.outputs.go == 'yes'
      - name: Optional photo tools (real news photos - super-resolution, AVIF); the story is written without them if this fails
        run: pip install -q opencv-contrib-python-headless==4.10.0.84 pillow-avif-plugin==1.4.6 || echo 'photo tools not installed'
        if: steps.sw.outputs.go == 'yes'
      - name: Collect, write, validate, send
        if: steps.sw.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}      # paid pictures ONLY when no free source made one
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # owner 29 Oct: paid Claude ONLY when every free model failed / is out of quota
          ANTHROPIC_MODEL: claude-haiku-5-5      # owner 29 Oct: newest Haiku (older one only as automatic fallback)
          MANUAL_URL: ${{ github.event.inputs.manual_url }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          BUDGET_MIN: "55"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTO_IMAGES: "1"          # ONE image per story: free first (Cloudflare -> NVIDIA), then FAL schnell -> dev; if all fail for 30 min -> plain branded background
          WRITE_STORIES: '1'
          COLLECT_MODE: both        # owner 31 Oct: each round collects AND writes its top 3 (a link given by hand is written at once too)
          MAX_STORIES: "3"          # owner 31 Oct: top 3 per round by expected views; every power cut is written on top
          WRITE_WORKERS: "3"        # stories written at the same time
          FRESH_DAYS: "1"           # owner 29 Oct: news published TODAY only (Coimbatore)
          CITY_ONLY: "0"            # owner 31 Oct: the WHOLE district competes (a city story wins a tie: score +1)
          DAILY_CAP: "1000"         # owner 31 Oct (4:48 PM): NO daily limit - every 2-hour round posts its top 3; only Instagram's own 50 a day applies
        run: |
          mkdir -p research_free/results
          FLAG=""; [ "${{ github.event.inputs.dry }}" = "true" ] && FLAG="--dry"
          for TRY in 1 2; do
            python -u research_free/collect.py $FLAG > research_free/results/collect.log 2>&1 && break
            echo "exit $? (try $TRY)" >> research_free/results/collect.log
            cp research_free/results/collect.log research_free/results/collect_failed.log
            sleep 60
          done
          tail -15 research_free/results/collect.log
      - name: Save log
        if: always() && steps.sw.outputs.go == 'yes'
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results research_free/archive
          git commit -m "free collector log" || echo none
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*4)); done || true
      - name: Fail loudly if the collector crashed (GitHub then emails the repo owner)
        if: steps.sw.outputs.go == 'yes'
        run: |
          if grep -q "Traceback" research_free/results/collect.log; then echo "collector crashed twice"; exit 1; fi
