name: website-backfill
# Coimbatore 360: THE WEBSITE IS OFF FOR NOW. Manual run only (no schedule). WEBSITE_INGEST_KEY is not passed, so
# poster/website.py does nothing. When a Coimbatore website exists: add the secret WEBSITE_INGEST_KEY, pass it below
# (env), then this sends every story already posted on Instagram to the website, oldest first, with its English version.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Start from this story (e.g. RN-1)"
        default: "RN-1"
permissions: { contents: read }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests==2.32.5 pillow==11.3.0
      - name: Send posted stories to the website
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAUDE_MAX_CALLS: "0"      # Coimbatore: Claude backup OFF (free models only; no ANTHROPIC_API_KEY passed)
        run: python -u poster/website.py backfill --from "${{ inputs.from }}"
